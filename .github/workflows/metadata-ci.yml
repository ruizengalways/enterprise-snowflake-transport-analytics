name: Metadata CI

on:
  pull_request:
    paths:
      - "config/**"
      - "contracts/**"
      - ".github/workflows/metadata-ci.yml"
  push:
    branches:
      - main
    paths:
      - "config/**"
      - "contracts/**"
      - ".github/workflows/metadata-ci.yml"

permissions:
  contents: read

jobs:
  metadata:
    name: Validate project metadata
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Validate metadata with pinned framework
        uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/actions/validate-metadata@bad64b892193646ec0d28f773a50561b086bcb39
