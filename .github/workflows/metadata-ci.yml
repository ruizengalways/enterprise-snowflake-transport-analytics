name: Transport Contract CI

on:
  pull_request:
    paths: ["config/**", "contracts/**", "silver_processing/**", ".github/workflows/metadata-ci.yml"]
  push:
    branches: [main]
    paths: ["config/**", "contracts/**", "silver_processing/**", ".github/workflows/metadata-ci.yml"]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate project, RAW and Silver contracts
        uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/actions/validate-metadata@3f264d2446493c6ddfb4c62815e3094f372b92a2
