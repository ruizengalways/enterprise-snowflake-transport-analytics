name: Metadata v2 CI

on:
  pull_request:
    paths: ["config/**", "contracts/**", ".github/workflows/metadata-ci.yml"]
  push:
    branches: [main]
    paths: ["config/**", "contracts/**", ".github/workflows/metadata-ci.yml"]

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate with clean framework v2
        uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/actions/validate-metadata@0e9dedd2761d93cac74835ec6e6ab07b56da2eaa
