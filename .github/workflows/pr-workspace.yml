name: PR Workspace

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write

jobs:
  workspace:
    if: ${{ vars.ESF_PR_WORKSPACE_ENABLED == 'true' }}
    uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/workflows/pr-workspace.yml@b81d0150c96e8bf5bbacee11438971be5df676b6
    with:
      project_code: TRANSPORT
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action == 'closed' && 'drop' || 'create' }}
      framework_ref: b81d0150c96e8bf5bbacee11438971be5df676b6
