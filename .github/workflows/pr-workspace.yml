name: PR Workspace

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

permissions:
  contents: read
  id-token: write

jobs:
  workspace:
    uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/workflows/pr-workspace.yml@02e3fca78b453e8a39a1722ce96b15dfc98d7cf8
    with:
      project_code: TRANSPORT
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action == 'closed' && 'drop' || 'create' }}
      framework_ref: 02e3fca78b453e8a39a1722ce96b15dfc98d7cf8
