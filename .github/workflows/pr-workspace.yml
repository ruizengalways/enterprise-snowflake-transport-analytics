name: PR Workspace

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  id-token: write

jobs:
  workspace:
    uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/workflows/pr-workspace.yml@7d3498f8b5ef48d868ea44aade62cf13e50e58f6
    with:
      project_code: TRANSPORT
      pr_number: ${{ github.event.pull_request.number }}
      action: ${{ github.event.action == 'closed' && 'drop' || 'create' }}
      framework_ref: 7d3498f8b5ef48d868ea44aade62cf13e50e58f6
