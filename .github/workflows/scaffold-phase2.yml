name: One-time Framework 0.25 Silver scaffold

on:
  push:
    branches: [migration/framework-025-silver-candidates]
    paths: [.github/workflows/scaffold-phase2.yml]

permissions:
  contents: write

jobs:
  scaffold:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v7.0.1
        with:
          ref: migration/framework-025-silver-candidates
          fetch-depth: 0
      - name: Checkout immutable Framework 0.25
        uses: actions/checkout@v7.0.1
        with:
          repository: ruizengalways/enterprise-snowflake-data-project-framework
          ref: b81d0150c96e8bf5bbacee11438971be5df676b6
          path: framework
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Install Framework 0.25
        run: python -m pip install ./framework
      - name: Validate adopted metadata boundary
        run: esf validate --project-root .
      - name: Scaffold reviewed Silver ownership units once
        shell: bash
        run: |
          set -euo pipefail
          test ! -e silver_processing/fleet_mssql/vehicle_status
          test ! -e silver_processing/gtfs_realtime/vehicle_position
          esf scaffold scd2 vehicle_status --source fleet_mssql --project-root .
          esf scaffold append vehicle_position --source gtfs_realtime --project-root .
          esf validate --project-root .
          test ! -e control_plane
          changed="$(git diff --name-only -- silver_processing)"
          test -n "$changed"
          if git diff --name-only | grep -Ev '^silver_processing/' >/dev/null; then
            echo "One-time scaffold modified files outside silver_processing/." >&2
            git diff --name-only >&2
            exit 1
          fi
      - name: Commit generated source code to migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add silver_processing
          git commit -m "feat: scaffold Framework 0.25 Silver ownership units"
          git push origin HEAD:migration/framework-025-silver-candidates
