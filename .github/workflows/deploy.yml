name: Deploy
run-name: Deploy TRANSPORT ${{ github.sha }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target Snowflake environment. Run this workflow from main."
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-transport-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/workflows/project-deploy.yml@801d319776ad7ac24042d323db6e0c1c5f75f2b1
    with:
      project_code: TRANSPORT
      environment: ${{ inputs.environment }}
      git_sha: ${{ github.sha }}
      framework_ref: 801d319776ad7ac24042d323db6e0c1c5f75f2b1
      project_dir: dbt
