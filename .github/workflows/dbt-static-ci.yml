name: Transport Silver + dbt CI

on:
  pull_request:
    paths: ["dbt/**", "config/**", "contracts/**", "silver_processing/**", "operations/**", ".github/workflows/dbt-static-ci.yml"]
  push:
    branches: [main]
    paths: ["dbt/**", "config/**", "contracts/**", "silver_processing/**", "operations/**", ".github/workflows/dbt-static-ci.yml"]

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    env:
      ESF_ENVIRONMENT: dev
      SNOWFLAKE_ACCOUNT: offline
      SNOWFLAKE_USER: offline
      DBT_DATABASE: OFFLINE_TRANSPORT
      DBT_WAREHOUSE: OFFLINE_TRANSFORM
      DBT_DEFAULT_SCHEMA: GOLD_MARTS
      DBT_SILVER_SCHEMA: SILVER_CANONICAL
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          repository: ruizengalways/enterprise-snowflake-data-project-framework
          ref: 3f264d2446493c6ddfb4c62815e3094f372b92a2
          path: framework
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install dbt-core==1.12.3 dbt-snowflake==1.12.0
          python -m pip install ./framework

      - name: Validate explicit Silver contracts
        run: esf validate --project-root .

      - name: Parse ordinary dbt Gold models
        run: dbt parse --no-partial-parse --project-dir dbt --profiles-dir dbt

      - name: Assert dbt begins at trusted Silver
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dbt/packages.yml
          test ! -e dbt/models/silver_staging
          test ! -e dbt/models/silver_canonical
          test ! -e dbt/macros
          if grep -R -n 'enterprise_snowflake_framework' dbt; then exit 1; fi
          if grep -R -n 'BRONZE\.' dbt/models; then exit 1; fi
          grep -Fq "source('silver_transport', 'vehicle_status_current')" dbt/models/gold_marts/depot_fleet_status.sql
          grep -Fq "source('silver_transport', 'vehicle_position')" dbt/models/gold_marts/fct_vehicle_position.sql
          grep -Fq 'SILVER_CANONICAL' dbt/models/sources.yml
          grep -Fq 'DBT_DEFAULT_SCHEMA' dbt/profiles.yml

      - name: Assert readable SCD2 implementation surface
        shell: bash
        run: |
          set -euo pipefail
          FILE=silver_processing/vehicle_status/010_apply.sql
          grep -Fq 'VEHICLE_STATUS_NEW_EVENTS' "$FILE"
          grep -Fq 'VEHICLE_STATUS_AFFECTED_KEYS' "$FILE"
          grep -Fq 'begin transaction' "$FILE"
          grep -Fq 'VEHICLE_STATUS_HISTORY__EVENTS' "$FILE"
          grep -Fq 'state_boundaries' "$FILE"
          grep -Fq 'lead(source_updated_at)' "$FILE"
          grep -Fq 'published_versions' "$FILE"
          grep -Fq 'version_order' "$FILE"
          grep -Fq 'next_boundary_at is null as is_current' "$FILE"
          grep -Fq "source_operation = 'D'" "$FILE"
          grep -Fq 'rollback' "$FILE"
          grep -Fq 'where is_current = true' silver_processing/vehicle_status/001_objects.sql
          grep -Fq 'pattern: scd2' silver_processing/vehicle_status/pipeline.yml
          grep -Fq 'pattern: append' silver_processing/vehicle_position/pipeline.yml

      - name: Assert processing reset preserves Bronze
        shell: bash
        run: |
          set -euo pipefail
          FILE=operations/reset_vehicle_status.sql
          grep -Fq 'PROCESSING_FULL_RESET' "$FILE"
          grep -Fq 'VEHICLE_STATUS_HISTORY__EVENTS' "$FILE"
          grep -Fq "'bronze_preserved', true" "$FILE"
          if grep -Eiq 'truncate[[:space:]]+table[^;]*BRONZE' "$FILE"; then exit 1; fi
