name: Transport dbt legacy-runtime CI

on:
  pull_request:
    paths: ["dbt/**", "config/**", "contracts/**", ".github/workflows/dbt-static-ci.yml"]
  push:
    branches: [main]
    paths: ["dbt/**", "config/**", "contracts/**", ".github/workflows/dbt-static-ci.yml"]

permissions:
  contents: read

jobs:
  dbt-offline:
    runs-on: ubuntu-latest
    env:
      ESF_ENVIRONMENT: dev
      SNOWFLAKE_ACCOUNT: offline
      SNOWFLAKE_USER: offline
      DBT_DATABASE: OFFLINE_TRANSPORT
      DBT_WAREHOUSE: OFFLINE_TRANSFORM
      DBT_DEFAULT_SCHEMA: SILVER_STAGING
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dbt
        run: python -m pip install dbt-core==1.12.3 dbt-snowflake==1.12.0
      - name: Parse existing dbt runtime offline
        shell: bash
        run: |
          set -euo pipefail
          # Current Framework contracts are validated independently by Framework Contract CI.
          # This job intentionally validates only the still-active legacy dbt runtime during migration.
          dbt deps --project-dir dbt --profiles-dir dbt
          dbt parse --no-partial-parse --project-dir dbt --profiles-dir dbt
      - name: Assert migration boundary and domain readability
        shell: bash
        run: |
          set -euo pipefail
          # Current machine contracts are source-scoped.
          grep -Fq 'pattern: scd2' config/sources/fleet_mssql.yml
          grep -Fq 'pattern: append' config/sources/gtfs_realtime.yml
          grep -Fq 'schema_version: 2' contracts/raw/fleet_mssql/vehicle_status.yml
          grep -Fq 'schema_version: 2' contracts/raw/gtfs_realtime/vehicle_position.yml

          # Legacy metadata remains reference-only until Silver candidate comparison is complete.
          grep -Fq 'strategy: scd2' config/datasets/vehicle_status.yml
          grep -Fq 'strategy: append_only' config/datasets/vehicle_position.yml
          grep -Fq 'type: dynamic_table' config/datasets/depot_fleet_status.yml

          grep -Fq "where is_current = true" dbt/models/silver_canonical/vehicle_status_current.sql
          if grep -Fq 'is_current' dbt/models/gold_marts/depot_fleet_status.sql; then exit 1; fi
          if grep -R -n -E 'load_strategy|scd1_merge|scd2_merge|scd2_snapshot|scd2_stream_task|checkpoint_kind' config contracts dbt/models; then exit 1; fi
      - name: Assert v2 processing reset contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=dbt/macros/reset_contract.sql
          test -f "$FILE"
          grep -Fq 'transport_vehicle_status_full_reset' "$FILE"
          grep -Fq 'esf_execute_dataset_full_reset' "$FILE"
          grep -Fq '.SILVER_CANONICAL.VEHICLE_STATUS_HISTORY' "$FILE"
          grep -Fq '.SILVER_CANONICAL.VEHICLE_STATUS_HISTORY__ESF_EVENTS' "$FILE"
          grep -Fq "'dev': 'DEV_TRANSPORT'" "$FILE"
          grep -Fq 'ESF_SCHEMA_PREFIX' "$FILE"
          grep -Fq "'bronze_preserved', TRUE" "$FILE"
          if grep -Fq '.BRONZE.' "$FILE"; then exit 1; fi
          if grep -Eq 'SILVER_STAGING|GOLD_MARTS|VEHICLE_STATUS_CURRENT' "$FILE"; then exit 1; fi
