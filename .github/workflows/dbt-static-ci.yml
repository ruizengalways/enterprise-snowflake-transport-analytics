name: dbt Static CI

on:
  pull_request:
    paths:
      - "dbt/**"
      - "config/**"
      - "contracts/**"
      - ".github/workflows/dbt-static-ci.yml"
      - ".github/workflows/deploy.yml"
  push:
    branches:
      - main
    paths:
      - "dbt/**"
      - "config/**"
      - "contracts/**"
      - ".github/workflows/dbt-static-ci.yml"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

jobs:
  parse:
    name: Validate dbt project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Parse with pinned framework
        uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/actions/dbt-static-check@02e3fca78b453e8a39a1722ce96b15dfc98d7cf8
        with:
          project-code: TRANSPORT
          project-dir: dbt
          project-root: .

      - name: Assert one-click deploy wrapper contract
        shell: bash
        run: |
          set -euo pipefail
          FILE=".github/workflows/deploy.yml"
          INPUTS="$(sed -n '/^[[:space:]]*inputs:/,/^permissions:/p' "$FILE")"

          grep -Fq 'environment:' <<<"$INPUTS"
          if grep -Fq 'git_sha:' <<<"$INPUTS"; then
            echo "Transport Deploy UI must not expose a manual git_sha input." >&2
            exit 1
          fi

          grep -Fq 'uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/workflows/project-deploy.yml@02e3fca78b453e8a39a1722ce96b15dfc98d7cf8' "$FILE"
          grep -Fq 'project_code: TRANSPORT' "$FILE"
          grep -Eq '^[[:space:]]+git_sha:.*github[.]sha' "$FILE"
          grep -Fq 'framework_ref: 02e3fca78b453e8a39a1722ce96b15dfc98d7cf8' "$FILE"

          if grep -Eq 'ACTIONS_ID_TOKEN_REQUEST|SNOWFLAKE_TOKEN|SNOWFLAKE_OIDC_AUDIENCE' "$FILE"; then
            echo "Transport wrapper must delegate WIF/token handling to the reusable framework workflow." >&2
            exit 1
          fi

      - name: Render Transport operational control contract
        shell: bash
        run: |
          set -euo pipefail
          dbt run-operation transport_operational_contract_sql \
            --vars "$(cat "${RUNNER_TEMP}/esf-dbt-vars.json")" \
            --project-dir dbt \
            --profiles-dir dbt \
            | tee "${RUNNER_TEMP}/transport-operational-contract.txt"

      - name: Assert Transport domain isolation contract
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/transport-operational-contract.txt"
          grep -qi "from PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_CHECKPOINT" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_ADVANCE_PIPELINE_CHECKPOINT" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_RUN_START" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_RUN_FINISH" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_RECORD_PIPELINE_CHECK_RESULT" "$FILE"
          if grep -qi "call PLATFORM_CONTROL.OPERATIONS.ADVANCE_PIPELINE_CHECKPOINT" "$FILE"; then
            echo "Transport runtime contract must not call the generic checkpoint procedure." >&2
            exit 1
          fi
          if grep -qi "merge into PLATFORM_CONTROL.OPERATIONS.PIPELINE_RUN" "$FILE"; then
            echo "Transport runtime contract must not write directly to the shared run ledger." >&2
            exit 1
          fi

      - name: Render Transport dataset config snapshot contract
        shell: bash
        run: |
          set -euo pipefail
          dbt run-operation transport_vehicle_status_config_snapshot_contract_sql \
            --vars "$(cat "${RUNNER_TEMP}/esf-dbt-vars.json")" \
            --project-dir dbt \
            --profiles-dir dbt \
            | tee "${RUNNER_TEMP}/transport-config-snapshot-contract.txt"

      - name: Assert Transport config snapshot isolation contract
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/transport-config-snapshot-contract.txt"
          grep -qi "from PLATFORM_CONTROL.CONFIG.TRANSPORT_DATASET_CONFIG_SNAPSHOT" "$FILE"
          grep -qi "call PLATFORM_CONTROL.CONFIG.TRANSPORT_REGISTER_DATASET_CONFIG_SNAPSHOT" "$FILE"
          grep -qi "vehicle_status" "$FILE"
          if grep -Eqi "(insert|update|merge|delete)[[:space:]].*PLATFORM_CONTROL\.CONFIG\.DATASET_CONFIG_SNAPSHOT" "$FILE"; then
            echo "Transport config contract must not DML the shared config snapshot table directly." >&2
            exit 1
          fi

      - name: Render Transport SCD2 contract
        shell: bash
        run: |
          set -euo pipefail
          dbt run-operation transport_vehicle_status_scd2_contract_sql \
            --vars "$(cat "${RUNNER_TEMP}/esf-dbt-vars.json")" \
            --project-dir dbt \
            --profiles-dir dbt \
            | tee "${RUNNER_TEMP}/transport-scd2-contract.txt"

      - name: Assert metadata-driven SCD2 contract
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/transport-scd2-contract.txt"
          grep -qi "from TRANSPORT_EVENT_RELATION as source_rows" "$FILE"
          grep -qi "hash(" "$FILE"
          grep -qi 'source_rows."status"' "$FILE"
          grep -qi 'source_rows."depot_id"' "$FILE"
          grep -qi 'source_rows."route_id"' "$FILE"
          grep -qi '"source_updated_at"' "$FILE"
          grep -qi '"source_sequence"' "$FILE"
          grep -qi '"source_operation"' "$FILE"
          grep -qi "_esf_valid_from" "$FILE"
          grep -qi "begin transaction" "$FILE"
          grep -qi "delete from TRANSPORT_HISTORY_RELATION" "$FILE"
          grep -qi "using TRANSPORT_AFFECTED_KEYS_RELATION" "$FILE"

      - name: Render Transport bootstrap handoff contract
        shell: bash
        run: |
          set -euo pipefail
          dbt run-operation transport_vehicle_status_bootstrap_contract_sql \
            --vars "$(cat "${RUNNER_TEMP}/esf-dbt-vars.json")" \
            --project-dir dbt \
            --profiles-dir dbt \
            | tee "${RUNNER_TEMP}/transport-bootstrap-contract.txt"

      - name: Assert Transport bootstrap domain contract
        shell: bash
        run: |
          set -euo pipefail
          FILE="${RUNNER_TEMP}/transport-bootstrap-contract.txt"
          grep -qi "from PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_BOOTSTRAP" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_BOOTSTRAP_START" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_BOOTSTRAP_MARK_SNAPSHOT_LANDED" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_BOOTSTRAP_MARK_VALIDATED" "$FILE"
          grep -qi "call PLATFORM_CONTROL.OPERATIONS.TRANSPORT_PIPELINE_BOOTSTRAP_COMMIT_HANDOFF" "$FILE"
          grep -qi "'source_position'" "$FILE"
          grep -qi "'exclusive'" "$FILE"
          grep -qi "TRUE" "$FILE"
          if grep -Eqi "call PLATFORM_CONTROL\.OPERATIONS\.PIPELINE_BOOTSTRAP" "$FILE"; then
            echo "Transport bootstrap contract must not call a generic shared bootstrap procedure." >&2
            exit 1
          fi
          if grep -Eqi "(insert|update|merge|delete)[[:space:]].*PLATFORM_CONTROL\.OPERATIONS\.PIPELINE_(BOOTSTRAP|CHECKPOINT)" "$FILE"; then
            echo "Transport bootstrap contract must not write shared control tables directly." >&2
            exit 1
          fi
