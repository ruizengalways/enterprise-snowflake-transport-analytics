name: dbt Static CI

on:
  pull_request:
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-static-ci.yml"
  push:
    branches:
      - main
    paths:
      - "dbt/**"
      - ".github/workflows/dbt-static-ci.yml"

permissions:
  contents: read

jobs:
  parse:
    name: Validate dbt project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Parse with pinned framework
        uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/actions/dbt-static-check@8d78f2e00b625debc3c848adeb9fc26797b01753
        with:
          project-code: TRANSPORT
          project-dir: dbt
