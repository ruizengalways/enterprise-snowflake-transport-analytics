name: dbt Static CI

on:
  pull_request:
    paths:
      - "dbt/**"
      - "config/**"
      - "contracts/**"
      - ".github/workflows/dbt-static-ci.yml"
  push:
    branches:
      - main
    paths:
      - "dbt/**"
      - "config/**"
      - "contracts/**"
      - ".github/workflows/dbt-static-ci.yml"

permissions:
  contents: read

jobs:
  parse:
    name: Validate dbt project
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Parse with pinned framework
        uses: ruizengalways/enterprise-snowflake-data-project-framework/.github/actions/dbt-static-check@3408025d4280d57c3bbed0c295e1686fa7d950ea
        with:
          project-code: TRANSPORT
          project-dir: dbt
          project-root: .
