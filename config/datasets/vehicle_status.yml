schema_version: 2

dataset:
  id: vehicle_status
  owner_team: transport-data
  raw_contract: contracts/raw/fleet_mssql/vehicle_status.yml
  load:
    strategy: scd2
    business_key:
      - vehicle_id
    watermark_column: source_updated_at
    scd2:
      effective_at_column: source_updated_at
      order_columns:
        - source_updated_at
        - source_sequence
      tracked_columns:
        - status
        - depot_id
        - route_id
      delete:
        operation_column: source_operation
        values:
          - D
      late_arrival:
        strategy: rebuild_affected_keys
  materialization:
    type: table
  runtime:
    mode: dbt
  compute:
    workload: transform
  quality:
    freshness:
      warn_after_minutes: 15
      error_after_minutes: 60
    reconciliation:
      enabled: true
      measures:
        - row_count
        - distinct_business_key
        - min_max_source_timestamp
