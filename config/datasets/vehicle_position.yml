schema_version: 2

dataset:
  id: vehicle_position
  owner_team: transport-data
  raw_contract: contracts/raw/vehicle_position.yml
  load:
    strategy: append_only
    watermark_column: event_timestamp
  materialization:
    type: table
  runtime:
    mode: dbt
  compute:
    workload: transform
  quality:
    freshness:
      warn_after_minutes: 5
      error_after_minutes: 15
    reconciliation:
      enabled: true
      measures:
        - row_count
        - min_max_source_timestamp
