schema_version: 2
contract:
  source_system: gtfs_realtime
  entity: vehicle_position
  grain: one row per vehicle position event
  business_key:
    - vehicle_id
  source_timestamp: event_timestamp
  columns:
    - name: vehicle_id
      type: VARCHAR
      nullable: false
      classification: internal
    - name: event_timestamp
      type: TIMESTAMP_NTZ
      nullable: false
      classification: internal
    - name: latitude
      type: FLOAT
      nullable: false
      classification: public
    - name: longitude
      type: FLOAT
      nullable: false
      classification: public
    - name: route_id
      type: VARCHAR
      nullable: true
      classification: public
    - name: ingested_at
      type: TIMESTAMP_NTZ
      nullable: false
      classification: internal
  change_semantics:
    mode: append
    delete_semantics: none
  capture_fidelity: full_event
  ordering_columns:
    - event_timestamp
  idempotency_key:
    - vehicle_id
    - event_timestamp
  breaking_change_policy: versioned_contract
